<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#12100e"><title>Tu cotización · ACCES OFF-ROAD</title><link rel="icon" href="/icons/icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;background:#12100e;color:#faf7f2;font:16px/1.5 system-ui}header,main{max-width:1100px;margin:auto;padding:20px}header{border-bottom:1px solid #54402d}h1{font-size:26px;color:#f87817}h2{font-size:22px}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #605140}input{width:100%;background:#201c18;color:white}button{background:#f87817;color:#12100e;cursor:pointer;font-weight:700}button:disabled{opacity:.45;cursor:default}.muted{color:#c4bbb1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#211d19;border:1px solid #4b3b2d;border-radius:14px;padding:18px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.cart-line{border-bottom:1px solid #514435;padding:14px 0}.cart-line input{width:80px}.remove{background:transparent;color:#faad78}.total{font-size:25px;font-weight:bold}#clock{font-weight:bold;color:#faaa68}[hidden]{display:none!important}#status{padding:16px;border:1px solid #725234;border-radius:12px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}@media print{body{background:white;color:black}header{border-color:#aaa}#searchArea,#products,#clock,#status,.actions,.cart-line input,.cart-line button{display:none!important}.card{background:white;border-color:#aaa}#cart{display:block!important}.muted{color:#555}}
</style></head><body><header><h1 id="business">ACCES OFF-ROAD</h1><p>Arma tu cotización en tienda</p><p id="clock" aria-live="off"></p></header><main><p id="status" role="status">Validando tu acceso…</p><div id="shop" hidden><p class="muted">Precios en USD. Cotización orientativa, sujeta a confirmación de precio, disponibilidad y compatibilidad en mostrador.</p><section id="searchArea"><label for="search">Busca el producto que estás viendo</label><input id="search" type="search" placeholder="Descripción, marca o número de parte"></section><h2>Productos</h2><div id="products" class="grid"></div><section id="cart" class="card" style="margin-top:24px"><h2>Tu cotización</h2><p id="folio"></p><div id="lines"></div><p id="subtotal"></p><p id="tax"></p><p id="total" class="total"></p><div class="actions"><button id="print" disabled>Imprimir / Guardar PDF</button><button id="download" disabled>Descargar resumen</button></div><p class="muted">Muestra esta cotización al vendedor. No realiza una compra ni reserva productos.</p></section></div><button id="retry" hidden>Volver a validar acceso</button></main><script type="module" src="/cliente.js"></script></body></html>
